<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>抽獎台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: 森洋品牌列 → 抽獎主題 → 三欄（獎項／參加名單／抽獎＋結果），手機改成單欄 */
/* 森洋設計系統：海洋藍為主色、陽光黃標記得獎、森林綠標獎項；中性色由印刷黑推出、偏暖。品牌只有淺色版，固定淺色。 */
:root {
  --bg: #f3f2f2;
  --surface: #ffffff;
  --ink: #231916;
  --muted: #5c5858;
  --line: #e7e6e5;
  --field: #faf9f9;
  --accent: #005bac;
  --accent-hover: #055196;
  --accent-ink: #ffffff;
  --accent-soft: #e0ebf5;
  --sun: #fac03d;
  --soft: #feefcd;
  --forest: #0b7670;
  --f-body: "GenSenRounded2 TW", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
.brandbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brandbar .logo { display: block; height: 52px; width: auto; }
.brandbar .app { font-size: 14px; color: var(--muted); letter-spacing: .12em; display: flex; align-items: center; gap: 8px; }
.brandbar .dots { display: inline-flex; gap: 4px; }
.brandbar .dots i { width: 8px; height: 8px; border-radius: 50%; display: block; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; display: flex; flex-direction: column; gap: 16px; }

button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 14px; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, textarea { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
h2 { margin: 0; font-size: 16px; font-weight: 700; }
.meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.foot-meta { color: var(--muted); font-size: 13px; text-align: center; font-variant-numeric: tabular-nums; }

/* 主題 */
.topic label { font-weight: 700; font-size: 16px; }
#title { width: 100%; font-size: clamp(18px, 3vw, 22px); font-weight: 700; padding: 10px 14px; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .col-draw { grid-column: 1 / -1; } }
@media (max-width: 640px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.col-draw { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* 獎項 */
.phead, .prow { display: grid; grid-template-columns: minmax(0, 1fr) 70px 32px; gap: 6px; align-items: center; }
.phead { font-size: 12px; color: var(--muted); }
#prizeList { display: flex; flex-direction: column; gap: 6px; }
.prow input[type=number] { text-align: center; padding-inline: 4px; font-family: var(--f-mono); }
.prow .del { padding: 4px 0; color: var(--muted); }
.add { border-style: dashed; color: var(--muted); }

/* 名單 */
#people { width: 100%; min-height: 260px; resize: vertical; line-height: 1.6; }
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: 14px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

/* 抽獎區 */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--field); }
.seg button { border: none; border-radius: 999px; padding: 5px 14px; background: transparent; color: var(--muted); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.ptabs { display: flex; flex-wrap: wrap; gap: 6px; }
.ptab { border-radius: 999px; padding: 3px 12px; font-size: 13px; }
.ptab[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.ptab.done { color: var(--muted); text-decoration: line-through; }
.ptab .n { font-family: var(--f-mono); font-size: 11px; margin-left: 6px; }
.stage { position: relative; overflow: hidden; text-align: center; align-items: center; }
.stage > .ptabs, .stage > .row { width: 100%; }
.now { font-size: clamp(20px, 3vw, 26px); font-weight: 900; text-wrap: balance; }
.status { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.reel { min-height: 120px; width: 100%; display: flex; flex-wrap: wrap; gap: 8px 10px; justify-content: center; align-content: center; align-items: center; }
.reel .nm { font-weight: 900; line-height: 1.15; overflow-wrap: anywhere; max-width: 100%; }
.reel.k1 .nm { font-size: clamp(34px, 6vw, 60px); }
.reel.kn .nm { font-size: 18px; padding: 3px 12px; border-radius: 999px; background: var(--accent-soft); }
.reel.rolling .nm { color: var(--muted); }
.reel.hit .nm { color: var(--accent); background-image: linear-gradient(transparent 62%, var(--soft) 62%); animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
.reel.kn.hit .nm { color: var(--ink); background: var(--soft); }
.reel .idle { color: var(--muted); font-size: 16px; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.go:hover:not(:disabled) { background: var(--accent-hover); }
.go { background: var(--accent); color: var(--accent-ink); border: none; font-size: 18px; font-weight: 900; letter-spacing: .08em; padding: 11px 40px; border-radius: 999px; }
.go:hover:not(:disabled) { filter: brightness(1.06); }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* 結果 */
#results { display: flex; flex-direction: column; gap: 14px; max-height: 460px; overflow-y: auto; }
.rg h3 { margin: 0 0 6px; font-size: 15px; color: var(--forest); }
.rg h3 .meta { font-weight: 400; margin-left: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px 3px 10px; background: var(--field); max-width: 100%; }
.chip .who { font-weight: 700; overflow-wrap: anywhere; }
.chip button { padding: 0 6px; font-size: 12px; color: var(--muted); border: none; background: transparent; }
.empty { color: var(--muted); font-size: 14px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.confirm { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); z-index: 9; }
@media (prefers-reduced-motion: reduce) { .reel.hit .nm { animation: none; } }
</style>

    <span class="app"><span class="dots" aria-hidden="true"><i style="background:var(--sun)"></i><i style="background:var(--accent)"></i><i style="background:#00a29a"></i></span>線上抽獎</span>
  </header>
  <section class="panel topic">
    <label for="title">抽獎主題</label>
    <input id="title" maxlength="80" placeholder="例如：粉專 10 萬讚感謝抽獎">
  </section>

  <div class="cols">
    <section class="panel">
      <h2>獎項內容</h2>
      <div class="phead"><span>獎項名稱</span><span style="text-align:center">名額</span><span></span></div>
      <div id="prizeList"></div>
      <button id="addPrize" class="add">＋ 新增獎項</button>
      <div class="foot-meta" id="prizeMeta"></div>
    </section>

    <section class="panel">
      <h2>參加名單</h2>
      <textarea id="people" placeholder="一行一個名字或帳號，可以直接貼上留言名單或 Excel 整欄"></textarea>
      <div class="foot-meta" id="peopleMeta"></div>
      <div class="row">
        <label class="check"><input type="checkbox" id="dedupe"> 重複的名字只算一次</label>
        <button id="clearPeople">清空</button>
      </div>
    </section>

    <div class="col-draw">
      <section class="panel stage">
        <div class="row">
          <div class="seg" role="group" aria-label="抽法">
            <button id="modeOne" aria-pressed="true">一次抽一個</button>
            <button id="modeAll" aria-pressed="false">整個獎項一起抽</button>
            <button id="modeEvery" aria-pressed="false">全部一次抽出</button>
          </div>
        </div>
        <div class="ptabs" id="ptabs" role="tablist" aria-label="選擇獎項"></div>
        <div class="now" id="now"></div>
        <div class="status" id="status"></div>
        <div class="reel k1" id="reel" aria-live="polite"></div>
        <button class="go" id="go">開始抽獎</button>
        <canvas id="fx"></canvas>
      </section>

      <section class="panel">
        <div class="panel-h"><h2>中獎結果</h2><span class="meta" id="winMeta"></span></div>
        <div id="results"></div>
        <div class="btns" id="actions">
          <button id="excel" class="primary">下載 Excel</button>
          <button id="copy">複製名單</button>
          <button id="reset">重新抽獎</button>
        </div>
        <div class="confirm" id="confirm" hidden>
          確定清除所有中獎結果？
          <button id="resetYes">清除</button>
          <button id="resetNo">取消</button>
        </div>
      </section>
    </div>
  </div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const KEY = 'luckydraw-v3';
  const SAMPLE = ['@amy_chen','@kevin.lin','@小雨','@jason_wu','@momo_tw','@阿哲','@ivy.huang','@pinky_lee','@大熊','@ruby_tsai','@tommy_yang','@芊芊','@leo_hsu','@nana_cheng','@阿凱','@mia_lai','@寶寶不哭','@eric_ko','@小魚','@joy_lu'];
  const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !Array.isArray(S.prizes)) S = {
    title: '粉專留言抽獎',
    prizes: [{ id: 'a', name: '頭獎：3,000 元禮券', count: 1 }, { id: 'b', name: '貳獎：1,000 元禮券', count: 2 }, { id: 'c', name: '參獎：100 元禮券', count: 5 }],
    people: SAMPLE.join('\n'), sample: true, dedupe: true, mode: 'one', current: 'a', results: [], out: []
  };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const $ = id => document.getElementById(id);
  const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };

  // 公平亂數：crypto + 拒絕取樣
  const rnd = n => { const max = Math.floor(0x100000000 / n) * n, b = new Uint32Array(1); let x; do { crypto.getRandomValues(b); x = b[0]; } while (x >= max); return x % n; };

  const entries = () => S.people.split(/\r?\n/).map(s => s.replace(/\t+/g, ' ').trim()).filter(Boolean);
  const list = () => S.dedupe ? [...new Set(entries())] : entries();
  // 已中獎或取消資格的人不會再被抽到
  const pool = () => { const ex = new Set([...S.results.map(r => r.name), ...S.out]); return list().filter(n => !ex.has(n)); };
  const cur = () => S.prizes.find(p => p.id === S.current) || S.prizes[0];
  const left = p => Math.max(0, p.count - S.results.filter(r => r.prizeId === p.id).length);
  const nextOpen = () => S.prizes.find(p => left(p) > 0);
  const totalLeft = () => S.prizes.reduce((s, p) => s + left(p), 0);
  let busy = false;

  // ---------- 獎項編輯 ----------
  function renderPrizes() {
    const box = $('prizeList'); box.textContent = '';
    S.prizes.forEach((p, i) => {
      const row = el('div', 'prow');
      const nm = el('input'); nm.id = 'pn-' + p.id; nm.value = p.name; nm.placeholder = '輸入獎項名稱'; nm.setAttribute('aria-label', `第 ${i + 1} 個獎項名稱`);
      nm.addEventListener('input', () => { p.name = nm.value; save(); renderStage(); renderResults(); });
      const ct = el('input'); ct.id = 'pc-' + p.id; ct.type = 'number'; ct.min = 1; ct.value = p.count; ct.setAttribute('aria-label', '名額');
      ct.addEventListener('input', () => { const v = parseInt(ct.value, 10); if (v >= 1) { p.count = Math.min(v, 9999); save(); renderMeta(); renderStage(); renderResults(); } });
      const del = el('button', 'del', '✕'); del.setAttribute('aria-label', '刪除獎項');
      const used = S.results.some(r => r.prizeId === p.id);
      del.disabled = busy || used || S.prizes.length <= 1;
      del.title = used ? '已經有人抽中這個獎項，清除中獎結果後才能刪除' : '刪除';
      del.addEventListener('click', () => { S.prizes = S.prizes.filter(x => x !== p); if (S.current === p.id) S.current = S.prizes[0].id; save(); renderAll(); });
      row.append(nm, ct, del); box.append(row);
    });
  }

  function renderMeta() {
    $('prizeMeta').textContent = `${S.prizes.length} 種獎項・${S.prizes.reduce((s, p) => s + p.count, 0)} 個中獎名額`;
    const all = entries();
    $('peopleMeta').textContent = `名單總數：${all.length} 筆・不重複名單：${new Set(all).size} 筆` + (S.sample ? '（範例）' : '');
  }

  // ---------- 抽獎區 ----------
  function renderStage() {
    $('modeOne').setAttribute('aria-pressed', String(S.mode === 'one'));
    $('modeAll').setAttribute('aria-pressed', String(S.mode === 'all'));
    $('modeEvery').setAttribute('aria-pressed', String(S.mode === 'every'));
    const tabs = $('ptabs'); tabs.textContent = '';
    const c = cur();
    S.prizes.forEach(p => {
      const l = left(p);
      const b = el('button', 'ptab' + (l ? '' : ' done'), p.name || '（未命名）');
      b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(p.id === c.id));
      b.append(el('span', 'n', `${p.count - l}/${p.count}`));
      b.disabled = busy;
      b.addEventListener('click', () => { S.current = p.id; save(); renderStage(); idle(); });
      tabs.append(b);
    });
    const l = left(c), pl = pool().length;
    if (S.mode === 'every') {
      const tl = totalLeft();
      $('now').textContent = '全部獎項';
      $('status').textContent = tl ? `還剩 ${tl} 個名額・可抽 ${pl} 人` : '所有獎項都抽完了';
      if (!busy) { $('go').textContent = tl ? `一次抽出 ${Math.min(tl, pl)} 位` : '全部抽完了'; $('go').disabled = !tl || !pl; }
      return;
    }
    $('now').textContent = c.name || '（未命名獎項）';
    $('status').textContent = l ? `名額 ${c.count} 位・還剩 ${l} 位・可抽 ${pl} 人` : `已抽完（${c.count} 位）`;
    if (!busy) {
      const nx = nextOpen(), go = $('go');
      if (l) { go.textContent = S.mode === 'all' ? `抽出 ${Math.min(l, pl)} 位` : (l < c.count ? '抽下一位' : '開始抽獎'); go.disabled = !pl; }
      else { go.textContent = nx ? '換下一個獎項' : '全部抽完了'; go.disabled = !nx; }
    }
  }

  function setReel(names, mode) {
    const r = $('reel'); r.textContent = '';
    r.className = 'reel ' + (names.length === 1 ? 'k1' : 'kn') + (mode ? ' ' + mode : '');
    names.forEach(n => r.append(el('div', 'nm', n)));
  }
  function idle() {
    if (busy) return;
    const r = $('reel'); r.className = 'reel k1'; r.textContent = '';
    r.append(el('div', 'idle', (S.mode === 'every' ? totalLeft() : left(cur())) ?(pool().length ? '準備好就按開始' : '名單裡沒有可以抽的人') : '這個獎項抽完了'));
  }

  // ---------- 結果 ----------
  function renderResults() {
    const box = $('results'); box.textContent = '';
    $('winMeta').textContent = S.results.length ? `${S.results.length} 位` : '';
    if (!S.results.length) box.append(el('div', 'empty', '抽出的得獎者會依獎項列在這裡。'));
    S.prizes.forEach(p => {
      const rs = S.results.filter(r => r.prizeId === p.id);
      if (!rs.length) return;
      const g = el('div', 'rg'), h = el('h3', null, p.name || '（未命名）');
      h.append(el('span', 'meta', `${rs.length}/${p.count} 位`));
      const chips = el('div', 'chips');
      rs.forEach(r => {
        const c = el('span', 'chip'); c.append(el('span', 'who', r.name));
        const b = el('button', null, '✕'); b.title = '取消資格（不符資格或放棄），名額空出來可以再抽'; b.setAttribute('aria-label', `取消 ${r.name} 的資格`);
        b.disabled = busy;
        b.addEventListener('click', () => { S.results = S.results.filter(x => x !== r); S.out.push(r.name); save(); renderAll(); toast(`已取消 ${r.name} 的資格，可以補抽一位`); });
        c.append(b); chips.append(c);
      });
      g.append(h, chips); box.append(g);
    });
    $('excel').disabled = $('copy').disabled = !S.results.length;
    $('reset').disabled = busy || (!S.results.length && !S.out.length);
  }

  function renderAll() { renderPrizes(); renderMeta(); renderStage(); renderResults(); idle(); }

  // ---------- 抽獎 ----------
  // 不重複抽出 k 人
  const pick = (pl, k) => { const arr = pl.slice(), win = []; for (let i = 0; i < k; i++) { const j = i + rnd(arr.length - i); [arr[i], arr[j]] = [arr[j], arr[i]]; win.push(arr[i]); } return win; };

  function drawEvery() {
    const pl = pool(), tl = totalLeft();
    if (!tl) return;
    if (!pl.length) return toast('名單裡沒有可以抽的人了');
    const k = Math.min(tl, pl.length);
    if (k < tl) toast(`可抽的人只剩 ${pl.length} 位，依獎項順序先抽出 ${k} 位`);
    const names = pick(pl, k), assign = [];
    let i = 0;
    S.prizes.forEach(p => { for (let n = left(p); n > 0 && i < names.length; n--) assign.push({ prizeId: p.id, name: names[i++] }); });
    spin(pl, names, assign);
  }

  function spin(pl, names, assign) {
    busy = true; $('go').disabled = true; $('go').textContent = '抽獎中…'; renderPrizes(); renderStage(); renderResults();
    const shown = Math.min(names.length, 12);
    const roll = () => setReel(Array.from({ length: shown }, () => pl[rnd(pl.length)]), 'rolling');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const delays = reduce ? [400] : [60,60,60,60,60,60,60,60,60,60,70,80,95,115,140,175,220,280];
    let i = 0;
    const step = () => {
      if (i < delays.length) { roll(); setTimeout(step, delays[i++]); return; }
      setReel(names, 'hit');
      const t = new Date().toISOString();
      assign.forEach(a => S.results.push({ prizeId: a.prizeId, name: a.name, t }));
      save(); busy = false;
      renderPrizes(); renderStage(); renderResults(); confetti();
    };
    step();
  }

  function draw() {
    if (busy) return;
    if (S.mode === 'every') return drawEvery();
    const c = cur(), l = left(c);
    if (!l) { const nx = nextOpen(); if (nx) { S.current = nx.id; save(); renderStage(); idle(); } return; }
    const pl = pool();
    if (!pl.length) return toast('名單裡沒有可以抽的人了');
    const k = S.mode === 'all' ? Math.min(l, pl.length) : 1;
    if (S.mode === 'all' && k < l) toast(`可抽的人只剩 ${pl.length} 位，先抽出 ${k} 位`);
    // 先決定得獎者（不重複抽樣），滾動只是動畫
    const win = pick(pl, k);
    spin(pl, win, win.map(n => ({ prizeId: c.id, name: n })));
  }

  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = $('fx'), st = cv.parentElement, dpr = window.devicePixelRatio || 1, w = st.clientWidth, h = st.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    const c = cv.getContext('2d'); c.scale(dpr, dpr);
    const cols = ['#fac03d', '#005bac', '#00a29a', '#fbd06f', '#4286c2'];
    const ps = Array.from({ length: 110 }, () => ({ x: w / 2, y: h * .55, vx: (Math.random() - .5) * 12, vy: -Math.random() * 11 - 3, s: 4 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .3, col: cols[(Math.random() * cols.length) | 0] }));
    const t0 = performance.now();
    const f = now => {
      const dt = now - t0; c.clearRect(0, 0, w, h);
      ps.forEach(p => { p.vy += .3; p.x += p.vx; p.y += p.vy; p.r += p.vr; c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.globalAlpha = Math.max(0, 1 - dt / 2200); c.fillStyle = p.col; c.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); c.restore(); });
      if (dt < 2200) requestAnimationFrame(f); else c.clearRect(0, 0, w, h);
    };
    requestAnimationFrame(f);
  }

  // ---------- 匯出 ----------
  const fmtTime = iso => { const d = new Date(iso), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}/${z(d.getMonth() + 1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; };
  function rows() {
    const out = [];
    S.prizes.forEach(p => S.results.filter(r => r.prizeId === p.id).forEach((r, i) => out.push([p.name, i + 1, r.name, fmtTime(r.t)])));
    return out;
  }
  // 頁面內：透過 downloads 能力存檔；直接用瀏覽器開本機檔：用一般下載連結
  let dl = null;
  if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { dl = d; }).catch(() => {});
  $('excel').addEventListener('click', async () => {
    if (!window.XLSX) return toast('Excel 元件沒有載入，請確認網路連線後重新整理');
    const aoa = [[S.title || '抽獎'], [`匯出時間：${fmtTime(new Date().toISOString())}`], [], ['獎項', '序號', '得獎者', '抽出時間'], ...rows()];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 28 }, { wch: 6 }, { wch: 24 }, { wch: 20 }];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '得獎名單');
    const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    const name = ((S.title || '抽獎').replace(/[\\/:*?"<>|]+/g, ' ').trim() || '抽獎') + '_得獎名單.xlsx';
    if (dl) {
      try { await dl.save({ filename: name, data: new Blob([buf]) }); toast('已下載 Excel'); }
      catch (e) { if (e && e.code !== 'declined') toast('這裡無法下載檔案，請改用「複製名單」'); }
      return;
    }
    const url = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    const a = el('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });

  $('copy').addEventListener('click', () => {
    const lines = [(S.title || '抽獎') + ' 得獎名單'];
    S.prizes.forEach(p => { const ns = S.results.filter(r => r.prizeId === p.id).map(r => r.name); if (ns.length) lines.push(`【${p.name}】${ns.join('、')}`); });
    const text = lines.join('\n');
    const fb = () => { const ta = el('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); toast(ok ? '已複製得獎名單' : '無法自動複製，請手動選取'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('已複製得獎名單'), fb); else fb();
  });

  // ---------- 事件 ----------
  $('title').value = S.title; $('people').value = S.people; $('dedupe').checked = S.dedupe;
  $('title').addEventListener('input', e => { S.title = e.target.value; save(); });
  $('people').addEventListener('input', e => { S.people = e.target.value; S.sample = false; save(); renderMeta(); renderStage(); idle(); });
  $('dedupe').addEventListener('change', e => { S.dedupe = e.target.checked; save(); renderStage(); idle(); });
  $('clearPeople').addEventListener('click', () => { S.people = ''; S.sample = false; $('people').value = ''; save(); renderMeta(); renderStage(); idle(); $('people').focus(); });
  $('addPrize').addEventListener('click', () => { const id = uid(); S.prizes.push({ id, name: '', count: 1 }); save(); renderAll(); $('pn-' + id).focus(); });
  $('modeOne').addEventListener('click', () => { if (busy) return; S.mode = 'one'; save(); renderStage(); });
  $('modeAll').addEventListener('click', () => { if (busy) return; S.mode = 'all'; save(); renderStage(); });
  $('modeEvery').addEventListener('click', () => { if (busy) return; S.mode = 'every'; save(); renderStage(); idle(); });
  $('go').addEventListener('click', draw);
  $('reset').addEventListener('click', () => { $('actions').hidden = true; $('confirm').hidden = false; $('resetNo').focus(); });
  $('resetNo').addEventListener('click', () => { $('actions').hidden = false; $('confirm').hidden = true; });
  $('resetYes').addEventListener('click', () => { S.results = []; S.out = []; S.current = S.prizes[0].id; save(); $('actions').hidden = false; $('confirm').hidden = true; renderAll(); toast('已清除，可以重新抽'); });

  let tt;
  function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2600); }

  renderAll();
})();
</script>
